<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Markov 고객 세그먼트 식별기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        /* 프리셋 섹션 스타일 */
        .preset-section {
            margin-bottom: 40px;
            padding: 25px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 15px;
            border: 2px solid #f59e0b;
        }

        .preset-section h2 {
            color: #92400e;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
        }

        .preset-section h2::before {
            content: "⚡";
            margin-right: 10px;
            font-size: 1.2em;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .preset-btn {
            background: white;
            border: 2px solid #f59e0b;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .preset-btn:hover {
            background: #f59e0b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
        }

        .preset-btn .preset-title {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .preset-btn .preset-desc {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .section {
            margin-bottom: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .section h2 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
        }

        .section h2::before {
            content: "🎯";
            margin-right: 10px;
            font-size: 1.2em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .checkbox-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-right: 12px;
            transform: scale(1.2);
        }

        .checkbox-item.checked {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .analyze-btn {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 40px auto;
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.3);
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(72, 187, 120, 0.4);
        }

        .results {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-radius: 15px;
            border: 2px solid #e2e8f0;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .segment-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #48bb78;
        }

        .segment-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .priority-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 15px;
        }

        .tier1 {
            background: #48bb78;
            color: white;
        }

        .tier2 {
            background: #ed8936;
            color: white;
        }

        .tier3 {
            background: #a0aec0;
            color: white;
        }

        .approach-strategy {
            background: #ebf8ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            border-left: 4px solid #3182ce;
        }

        .value-props {
            background: #f0fff4;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            border-left: 4px solid #48bb78;
        }

        .persona-match {
            background: #fef5e7;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            border-left: 4px solid #ed8936;
        }

        .recommended-questions {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }

        .recommended-questions ul {
            list-style: none;
            padding-left: 0;
        }

        .recommended-questions li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
        }

        .recommended-questions li::before {
            content: "💬";
            position: absolute;
            left: 0;
        }

        .metric {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            margin: 5px;
            font-weight: 600;
            font-size: 0.9em;
        }

        /* 레퍼런스 케이스 스타일 */
        .reference-cases {
            background: #e8f5e8;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            border-left: 4px solid #4CAF50;
        }

        .reference-case-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.1);
            border-left: 4px solid #4CAF50;
        }

        .reference-case-item:last-child {
            margin-bottom: 0;
        }

        .case-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #2E7D32;
            margin-bottom: 8px;
        }

        .case-industry {
            font-size: 0.9em;
            color: #66BB6A;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .case-result {
            background: #E8F5E8;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9em;
            color: #388E3C;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .case-details {
            font-size: 0.85em;
            color: #4A4A4A;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .case-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .case-metric {
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }
            
            .content {
                padding: 20px;
            }
            
            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .preset-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 T-Markov 고객 세그먼트 식별기</h1>
            <p>5분만에 고객 유형을 파악하고 맞춤 접근 전략을 확인하세요</p>
        </div>

        <div class="content">
            <!-- 프리셋 섹션 추가 -->
            <div class="preset-section">
                <h2>빠른 테스트 프리셋</h2>
                <p style="margin-bottom: 15px; color: #92400e; font-size: 0.9em;">자주 사용되는 고객 프로필을 클릭 한 번으로 불러올 수 있습니다</p>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="loadPreset('samsung')">
                        <div class="preset-title">🏭 대형전자회사</div>
                        <div class="preset-desc">글로벌 제조업 리더</div>
                    </button>
                    <button class="preset-btn" onclick="loadPreset('kb')">
                        <div class="preset-title">🏦 Tier1은행</div>
                        <div class="preset-desc">대형 금융기관</div>
                    </button>
                    <button class="preset-btn" onclick="loadPreset('sk')">
                        <div class="preset-title">📡 통신사</div>
                        <div class="preset-desc">통신 대기업</div>
                    </button>
                    <button class="preset-btn" onclick="loadPreset('kepco')">
                        <div class="preset-title">⚡ 전력공기업</div>
                        <div class="preset-desc">공공기관</div>
                    </button>
                    <button class="preset-btn" onclick="loadPreset('hyundai')">
                        <div class="preset-title">🚗 모빌리티제조사</div>
                        <div class="preset-desc">글로벌 제조업체</div>
                    </button>
                    <button class="preset-btn" onclick="loadPreset('naver')">
                        <div class="preset-title">💚 대형포털</div>
                        <div class="preset-desc">IT 플랫폼 기업</div>
                    </button>
                    <button class="preset-btn" onclick="loadPreset('coupang')">
                        <div class="preset-title">📦 이커머스</div>
                        <div class="preset-desc">이커머스 대기업</div>
                    </button>
                    <button class="preset-btn" onclick="loadPreset('posco')">
                        <div class="preset-title">🏗️ 대형제조사</div>
                        <div class="preset-desc">철강 제조업</div>
                    </button>
                </div>
            </div>

            <!-- 1. 기본 정보 -->
            <div class="section">
                <h2>기본 고객 정보</h2>
                
                <div class="form-group">
                    <label for="company">회사명</label>
                    <input type="text" id="company" placeholder="예: 삼성전자, SK텔레콤">
                </div>

                <div class="form-group">
                    <label for="industry">업종</label>
                    <select id="industry">
                        <option value="">업종을 선택하세요</option>
                        <option value="manufacturing">🏭 제조업 (반도체/전자/자동차/화학)</option>
                        <option value="financial">🏦 금융업 (은행/증권/보험/핀테크)</option>
                        <option value="enterprise">🏢 기업서비스 (통신/물류/건설/컨설팅)</option>
                        <option value="public">🏛️ 공공/준공공 (정부/지자체/공기업/교육)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="size">기업 규모</label>
                    <select id="size">
                        <option value="">규모를 선택하세요</option>
                        <option value="global">🌍 글로벌 대기업 (매출 1조원 이상, 해외법인 10개 이상)</option>
                        <option value="midmarket">🏢 중견기업 (매출 1,000억~1조원, 해외법인 1~9개)</option>
                        <option value="smb">🏪 중소기업 (매출 100~1,000억원, 국내 중심)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="maturity">IT 성숙도</label>
                    <select id="maturity">
                        <option value="">IT 성숙도를 선택하세요</option>
                        <option value="leader">🚀 디지털 선도기업 (클라우드 퍼스트, DevOps 문화, CISO 조직)</option>
                        <option value="follower">⚡ 디지털 추격기업 (디지털 전환 진행 중, 하이브리드 IT)</option>
                        <option value="conservative">🏢 보수적 기업 (온프레미스 중심, 레거시 시스템 비중 높음)</option>
                    </select>
                </div>
            </div>

            <!-- 2. Pain Point 식별 -->
            <div class="section">
                <h2>주요 Pain Point 식별</h2>
                <p style="margin-bottom: 20px; color: #718096;">현재 고객이 겪고 있는 문제점들을 모두 선택해주세요. (복수 선택 가능)</p>
                
                <div class="checkbox-group" id="painPoints">
                    <div class="checkbox-item">
                        <input type="checkbox" id="slow_network" value="slow_network">
                        <label for="slow_network">🌐 해외 법인과의 네트워크 속도 지연</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="vpn_security" value="vpn_security">
                        <label for="vpn_security">🔒 VPN 보안 취약점 우려</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="high_cost" value="high_cost">
                        <label for="high_cost">💰 네트워크 운영비 부담</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="complex_manage" value="complex_manage">
                        <label for="complex_manage">🔧 복잡한 멀티벤더 솔루션 관리</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="compliance" value="compliance">
                        <label for="compliance">📋 보안 규제 대응 (ZTNA 의무화 등)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="remote_work" value="remote_work">
                        <label for="remote_work">🏠 원격근무 보안 관리 어려움</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="video_quality" value="video_quality">
                        <label for="video_quality">📹 글로벌 화상회의 품질 문제</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="data_transfer" value="data_transfer">
                        <label for="data_transfer">📊 대용량 데이터 전송 지연</label>
                    </div>
                </div>
            </div>

            <!-- 3. 의사결정자 정보 -->
            <div class="section">
                <h2>의사결정자 정보</h2>
                
                <div class="form-group">
                    <label for="decision_maker">주요 의사결정자 직책</label>
                    <select id="decision_maker">
                        <option value="">의사결정자를 선택하세요</option>
                        <option value="cio">👑 CIO/CDO/IT본부장 (디지털 전환 책임자)</option>
                        <option value="ciso">🔐 CISO/보안팀장 (정보보호 책임자)</option>
                        <option value="it_manager">💻 IT팀장/네트워크 관리자 (기술 실무진)</option>
                        <option value="cfo">💰 CFO/재무팀장 (예산 승인자)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budget_range">예상 IT 예산 규모 (연간)</label>
                    <select id="budget_range">
                        <option value="">예산 규모를 선택하세요</option>
                        <option value="high">💎 100억원 이상</option>
                        <option value="medium">💰 10억~100억원</option>
                        <option value="low">💵 1억~10억원</option>
                        <option value="minimal">🪙 1억원 미만</option>
                    </select>
                </div>
            </div>

            <button class="analyze-btn" onclick="analyzeCustomer()">
                🎯 고객 세그먼트 분석하기
            </button>

            <!-- 분석 결과 -->
            <div class="results" id="results">
                <div id="segmentResult"></div>
            </div>
        </div>
    </div>

    <script>
        // 프리셋 데이터
        const presets = {
            samsung: {
                company: '대형전자회사',
                industry: 'manufacturing',
                size: 'global',
                maturity: 'leader',
                painPoints: ['slow_network', 'data_transfer', 'video_quality', 'complex_manage'],
                decisionMaker: 'cio',
                budget: 'high'
            },
            kb: {
                company: 'Tier1은행',
                industry: 'financial',
                size: 'global',
                maturity: 'follower',
                painPoints: ['vpn_security', 'compliance', 'remote_work', 'slow_network'],
                decisionMaker: 'ciso',
                budget: 'high'
            },
            sk: {
                company: '통신사',
                industry: 'enterprise',
                size: 'global',
                maturity: 'leader',
                painPoints: ['complex_manage', 'high_cost', 'video_quality', 'data_transfer'],
                decisionMaker: 'cio',
                budget: 'high'
            },
            kepco: {
                company: '전력공기업',
                industry: 'public',
                size: 'global',
                maturity: 'conservative',
                painPoints: ['compliance', 'vpn_security', 'complex_manage', 'high_cost'],
                decisionMaker: 'ciso',
                budget: 'medium'
            },
            hyundai: {
                company: '모빌리티제조사',
                industry: 'manufacturing',
                size: 'global',
                maturity: 'follower',
                painPoints: ['slow_network', 'data_transfer', 'video_quality', 'remote_work'],
                decisionMaker: 'it_manager',
                budget: 'high'
            },
            naver: {
                company: '대형포털',
                industry: 'enterprise',
                size: 'global',
                maturity: 'leader',
                painPoints: ['high_cost', 'complex_manage', 'data_transfer', 'video_quality'],
                decisionMaker: 'cio',
                budget: 'high'
            },
            coupang: {
                company: '이커머스',
                industry: 'enterprise',
                size: 'midmarket',
                maturity: 'leader',
                painPoints: ['slow_network', 'high_cost', 'data_transfer', 'complex_manage'],
                decisionMaker: 'cfo',
                budget: 'medium'
            },
            posco: {
                company: '대형제조사',
                industry: 'manufacturing',
                size: 'global',
                maturity: 'conservative',
                painPoints: ['slow_network', 'vpn_security', 'compliance', 'data_transfer'],
                decisionMaker: 'it_manager',
                budget: 'medium'
            }
        };

        // 프리셋 로드 함수
        function loadPreset(presetName) {
            const preset = presets[presetName];
            if (!preset) return;

            // 기본 정보 입력
            document.getElementById('company').value = preset.company;
            document.getElementById('industry').value = preset.industry;
            document.getElementById('size').value = preset.size;
            document.getElementById('maturity').value = preset.maturity;
            document.getElementById('decision_maker').value = preset.decisionMaker;
            document.getElementById('budget_range').value = preset.budget;

            // 모든 체크박스 초기화
            document.querySelectorAll('#painPoints input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
                checkbox.closest('.checkbox-item').classList.remove('checked');
            });

            // Pain Points 체크
            preset.painPoints.forEach(point => {
                const checkbox = document.getElementById(point);
                if (checkbox) {

        function findMatchingReferenceCases(industry, size, maturity, painPoints) {
            const industryCases = referenceCases[industry] || [];
            
            return industryCases
                .map(caseItem => {
                    let score = 0;
                    
                    // 업종 완전 일치
                    score += 10;
                    
                    // 규모 매칭
                    if (caseItem.size === size) score += 8;
                    else if ((caseItem.size === 'global' && size === 'midmarket') || 
                             (caseItem.size === 'midmarket' && size === 'global')) score += 5;
                    
                    // 성숙도 매칭
                    if (caseItem.maturity === maturity) score += 6;
                    else if ((caseItem.maturity === 'leader' && maturity === 'follower') ||
                             (caseItem.maturity === 'follower' && maturity === 'leader')) score += 3;
                    
                    // Pain Point 매칭
                    const matchingPainPoints = caseItem.matchTypes.filter(type => painPoints.includes(type));
                    score += matchingPainPoints.length * 4;
                    
                    return { ...caseItem, score, matchingPainPoints };
                })
                .sort((a, b) => b.score - a.score)
                .slice(0, 5); // 최대 5개만 선별
        }

                'high_cost': '네트워크 운영비 부담',
                'complex_manage': '복잡한 솔루션 관리',
                'compliance': '보안 규제 대응',
                'remote_work': '원격근무 보안',
                'video_quality': '화상회의 품질',
                'data_transfer': '대용량 데이터 전송'
            };

            painPoints.forEach(point => {
                painPointText += `<span class="metric">${painPointMap[point]}</span>`;
            });

            // 레퍼런스 케이스 HTML 생성
            let referenceCasesHTML = '';
            if (matchedCases.length > 0) {
                referenceCasesHTML = `
                    <div class="reference-cases">
                        <h3>📋 추천 레퍼런스 케이스</h3>
                        <p style="margin-bottom: 15px; font-size: 0.9em; color: #2E7D32;">고객 프로필과 유사한 성공 사례들</p>
                        ${matchedCases.map(caseItem => `
                            <div class="reference-case-item">
                                <div class="case-title">${caseItem.title}</div>
                                <div class="case-industry">${caseItem.industry}</div>
                                <div class="case-result">${caseItem.result}</div>
                                <div class="case-details">${caseItem.details}</div>
                                <div class="case-metrics">
                                    ${caseItem.metrics.map(metric => `<span class="case-metric">${metric}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            segmentResultDiv.innerHTML = `
                <div class="segment-card">
                    <div class="segment-title">
                        ${segmentData.segmentName} 세그먼트 분석 결과
                        <span class="priority-badge tier${segmentData.tier}">${segmentData.priority}</span>
                    </div>
                    
                    <p><strong>고객명:</strong> ${company || '입력된 고객'}</p>
                    <p><strong>식별된 Pain Points:</strong></p>
                    <div style="margin: 10px 0;">${painPointText}</div>

                    <div class="approach-strategy">
                        <h3>🎯 권장 접근 전략</h3>
                        <p>${segmentData.approachStrategy}</p>
                    </div>

                    <div class="value-props">
                        <h3>💎 핵심 가치 제안</h3>
                        <ul>
                            ${segmentData.valueProps.map(prop => `<li>${prop}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="persona-match">
                        <h3>👤 타겟 페르소나 분석</h3>
                        <p>${segmentData.personaMatch}</p>
                    </div>

                    ${referenceCasesHTML}

                    <div class="recommended-questions">
                        <h3>💬 추천 질문 스크립트</h3>
                        <ul>
                            ${segmentData.questions.map(q => `<li>${q}</li>`).join('')}
                        </ul>
                    </div>

                    <div style="margin-top: 20px; padding: 15px; background: #e6fffa; border-radius: 10px; border-left: 4px solid #38b2ac;">
                        <h3>📋 다음 단계 액션 플랜</h3>
                        <ol>
                            <li><strong> ROI 계산:</strong> 고객 맞춤 ROI 분석서 작성</li>
                            <li><strong> 레퍼런스 공유:</strong> 동일 업종 성공 사례 제시(상품담당자 검증 필요)</li>
                            <li><strong> 데모 준비:</strong> Pain Point 해결 중심 데모 시나리오(기존 레퍼런스 검증 연동 필요)</li>

                        </ol>
                    </div>
                </div>
            `;

            resultsDiv.classList.add('show');
            resultsDiv.scrollIntoView({ behavior: 'smooth' });

    </script>
